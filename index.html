  const STORAGE_KEY = 'sc-wedding-key';

  const $ = (id) => document.getElementById(id);
  const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (bytes) => btoa(String.fromCharCode(...bytes));

  // Password -> 64 bytes of key material: first half AES key, second half HMAC key.
  async function deriveKeyMaterial(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(PAYLOAD.salt), iterations: PAYLOAD.iterations }, base, 512);
    return new Uint8Array(bits);
  }

  // Returns the page HTML, or null if the key material is wrong.
  async function decrypt(material) {
    const iv = fromB64(PAYLOAD.iv);
    const data = fromB64(PAYLOAD.data);
    const macKey = await crypto.subtle.importKey('raw', material.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const signed = new Uint8Array(iv.length + data.length);
    signed.set(iv);
    signed.set(data, iv.length);
    if (!(await crypto.subtle.verify('HMAC', macKey, fromB64(PAYLOAD.mac), signed))) return null;

    const aesKey = await crypto.subtle.importKey('raw', material.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, data);
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    // Replacing the document while this page is still loading (fonts etc.) is ignored
    // by some browsers, so wait for it to finish first.
    if (document.readyState !== 'complete') {
      window.addEventListener('load', () => show(html), { once: true });
      return;
    }
    document.open();
    document.write(html);
    document.close();
    // Honour links like index.html#rsvp once the real page is in place.
    if (location.hash) {
      const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) setTimeout(() => target.scrollIntoView(), 0);
    }
  }

  // The unlock key is kept for this tab (sessionStorage) so moving between pages
  // doesn't ask again, and also across visits (localStorage) with "Remember me".
  const storage = {
    get() {
      try { return localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    },
    set(v, remember) {
      try { sessionStorage.setItem(STORAGE_KEY, v); } catch (e) {}
      if (remember) { try { localStorage.setItem(STORAGE_KEY, v); } catch (e) {} }
    },
    clear() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
    },
  };

  function showGate() {
    $('gate').hidden = false;
    $('pw').focus();
  }

  $('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = $('pw').value;
    if (!password) { $('msg').textContent = 'Please enter the password.'; return; }

    $('msg').textContent = '';
    $('btn').disabled = true;
    $('btn').textContent = 'Opening…';
    try {
      const material = await deriveKeyMaterial(password);
      const html = await decrypt(material);
      if (html === null) {
        $('msg').textContent = 'That password isn’t right. Please check your invitation and try again.';
        $('pw').select();
        return;
      }
      storage.set(toB64(material), $('remember').checked);
      show(html);
    } catch (error) {
      console.error(error);
      $('msg').textContent = 'Something went wrong opening the website. Please try a different browser.';
    } finally {
      $('btn').disabled = false;
      $('btn').textContent = 'Enter';
    }
  });

  // Already unlocked in this tab, or a returning visitor who ticked "Remember me": open straight away.
  (async () => {
    const saved = storage.get();
    if (saved) {
      try {
        const html = await decrypt(fromB64(saved));
        if (html !== null) { show(html); return; }
      } catch (error) {
        console.error(error);
      }
      storage.clear(); // stale (e.g. the password changed)
    }
    showGate();
  })();
})();
</script>
